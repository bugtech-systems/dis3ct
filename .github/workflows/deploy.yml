name: Deploy Alayon Next App to Alayon Ubuntu Server

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: self-hosted  # Runs on your local Ubuntu machine
    steps:
    
      - name: Change to project directory
        run: cd /home/bugtechadmin/apps/alayon-next
    
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build the Next.js app
        run: npm run build

      - name: Start the Next.js app with PM2
        run: |
          npm install -g pm2
          pm2 restart 1
