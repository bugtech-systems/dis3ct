name: (atod@test) Deploy Alayon Next App to Alayon Ubuntu Server

on:
  push:
    branches:
      - development

jobs:
  build-and-deploy:
    runs-on: self-hosted  # Runs on your local Ubuntu machine
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Pull latest changes in project directory
        run: |
          cd /home/bugtechadmin/apps/alayon-next
          git reset --hard
          git fetch origin development
          git pull origin development

      - name: Install dependencies
        run: |
          cd /home/bugtechadmin/apps/alayon-next
          npm install

      - name: Build the Next.js app
        run: |
          cd /home/bugtechadmin/apps/alayon-next
          npm run build

      - name: Restart Next.js app with PM2
        run: |
          pm2 restart 1
