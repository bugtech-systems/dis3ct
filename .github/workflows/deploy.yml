name: Deploy Alayon Next App to Alayon Ubuntu Server

on:
  push:
    branches:
      - development

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Restart Application
        run: |
          pm2 restart 1

