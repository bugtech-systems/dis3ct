    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const pageId = getQueryParam("id");
            if (!pageId) {
                alert("Missing 'id' in URL");
                return;
            }
            loadDropdownOptions(pageId);
            readersDropDownPopulate(false)
        });



        function onSaveImage() {
            const gallery = document.getElementById('imageGallery');
            if (gallery.children.length >= 3) {
                alert('You can only save up to 3 fingerprint images.');
                return;
            }

            // Example image generation (replace with real image logic)
            const img = document.createElement('img');
            img.src = 'data:image/png;base64,...'; // your fingerprint data
            img.style.width = '100px';
            img.style.height = '100px';
            gallery.appendChild(img);
        }


        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }
        async function loadDropdownOptions(pageId) {
            try {
                const fullName = document.getElementById("fullName");
                const precinct = document.getElementById("precinct");

                // dropdown.innerHTML = ;

                const response = await fetch(`http://192.168.1.100:3500/api/contacts/scan/${encodeURIComponent(pageId)}`).
                    then(res => res.json())
                    .then(data => {
                        console.log(data, 'DATA')
                        fullName.innerHTML = data.name;
                        precinct.innerHTML = data.precinct;
                        // const option = document.createElement("option");
                        // option.value = item.id;
                        // option.textContent = item.name;
                        // dropdown.appendChild(option);
                    })




            } catch (err) {
                console.error("Error loading dropdown:", err);
                document.getElementById("fingerprintTypeDropdown").innerHTML =
                    "<option value=''>Failed to load options</option>";
            }
        }
        function onImageDownload() {
            const pageId = getQueryParam("id");

            // const dropdown = document.getElementById("fingerprintTypeDropdown");
            // const selectedId = dropdown.value;

            if (!pageId) {
                alert("Please select a contact.");
                return;
            }


            const imageElements = document.querySelectorAll('#imageGallery img');
            if (imageElements.length === 0) {
                alert("No images to upload!");
                return;
            }

            if (imageElements.length != 3) {
                alert('You can only submit 3 fingerprint images.');
                return;
            }


            const formData = new FormData();

            imageElements.forEach((img, index) => {
                const base64Data = img.src;
                const blob = dataURLToBlob(base64Data);
                formData.append(`file`, blob, `fingerprint${index + 1}.png`);
            });

            const uploadUrl = `http://192.168.1.100:3500/api/biometrics/upload?id=${encodeURIComponent(pageId)}`;


            fetch(uploadUrl, {
                method: "POST",
                body: formData
            })
                .then(res => {
                    if (!res.ok) throw new Error("Upload failed");
                    return res.json();
                })
                .then(data => {
                    alert("Upload successful!");
                    console.log(data);
                })
                .catch(err => {
                    console.error(err);
                    alert("Upload error: " + err.message);
                });
        }

        function dataURLToBlob(dataURL) {
            const parts = dataURL.split(';base64,');
            const byteString = atob(parts[1]);
            const mimeString = parts[0].split(':')[1];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mimeString });
        }
